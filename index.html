<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Team · Dr. Ardeleanu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html" aria-label="Marketing Team – acasă">
        <span class="brand__logo"><img src="assets/logo.png" alt="Dr. Ardeleanu Dental Clinics"></span>
        <span class="brand__text">
          <span class="brand__title">Marketing Team</span>
          <span class="brand__sub">Dr. Ardeleanu · Hub de lucru</span>
        </span>
      </a>
    </div>
  </header>

  <main class="page">
    <section class="cards" aria-label="Secțiuni">
      <article class="card">
        <h2 class="card__title">Marketing Team - Work</h2>
        <p class="card__desc">Spațiul de lucru al echipei de marketing.</p>

        <div class="card__actions">
          <button class="btn btn--main" type="button" aria-expanded="false" aria-controls="sub-rapoarte" data-toggle="sub-rapoarte">
            <span>Rapoarte</span>
            <svg class="btn__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <div class="sub" id="sub-rapoarte">
            <div class="sub__inner">
              <a class="btn btn--sub" href="saptamanale.html">Săptămânale</a>
              <a class="btn btn--sub" href="lunare.html">Lunare</a>
            </div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
