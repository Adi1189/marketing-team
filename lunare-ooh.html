<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OOH (Out-of-Home) · Marketing Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>if(location.search.indexOf('embed=1')>-1)document.documentElement.classList.add('embed')</script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h2 class="panel__title">OOH (Out-of-Home)</h2>
      <p style="margin:8px 0 0;color:var(--text-muted,#6b5a52)">Date în curs de adăugare. Canalul este pregătit în meniu; rapoartele lunare apar aici imediat ce avem cifrele.</p>
    </section>
  </main>
  <script>
    (function () {
      if (!window.parent || window.parent === window) return;
      function h() { parent.postMessage({ type: 'height', value: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }
      window.addEventListener('load', function () { parent.postMessage({ type: 'ready', kind: 'month', months: [], channel: 'ooh' }, '*'); h(); });
    })();
  </script>
</body>
</html>
